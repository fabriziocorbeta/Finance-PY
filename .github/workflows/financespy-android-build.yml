name: FinancePY Android Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build (defaults to the branch this workflow is run from)"
        required: false
        default: ""
  pull_request:
    paths:
      - 'native/financespy-kmp/**'

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/financespy-kmp

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform & build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: financespy-debug-apk
          path: native/financespy-kmp/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
