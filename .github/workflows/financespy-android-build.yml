name: FinancePY Android Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build (defaults to the branch this workflow is run from)"
        required: false
        default: ""
      buildType:
        description: "debug or release (release needs the FINANCESPY_RELEASE_* secrets)"
        required: false
        default: "debug"
        type: choice
        options:
          - debug
          - release
  pull_request:
    paths:
      - 'native/financespy-kmp/**'

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/financespy-kmp

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # android-actions/setup-android@v3 corre `sdkmanager tools` sin poder
      # saltearlo -- Google sacó ese paquete legacy del repositorio del SDK
      # y la action rompe siempre con "Failed to find package 'tools'".
      # ubuntu-latest ya trae el Android SDK preinstalado (ANDROID_HOME
      # seteado) pero el cmdline-tools/sdkmanager no está en PATH por
      # default, así que lo agregamos a mano antes de usarlo.
      - name: Add Android cmdline-tools to PATH
        run: |
          ANDROID_SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          find "$ANDROID_SDK_ROOT" -maxdepth 3 -iname "cmdline-tools" 2>/dev/null || true
          CMDLINE_TOOLS_BIN=$(dirname "$(find "$ANDROID_SDK_ROOT" -name sdkmanager -type f 2>/dev/null | sort -V | tail -1)")
          echo "Found sdkmanager dir: $CMDLINE_TOOLS_BIN"
          echo "$CMDLINE_TOOLS_BIN" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK platform & build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode release keystore
        if: inputs.buildType == 'release'
        working-directory: .
        run: |
          echo "${{ secrets.FINANCESPY_RELEASE_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/financespy-release.keystore"
          echo "FINANCESPY_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/financespy-release.keystore" >> "$GITHUB_ENV"

      - name: Build debug APK
        if: inputs.buildType != 'release'
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      - name: Build release APK
        if: inputs.buildType == 'release'
        env:
          FINANCESPY_RELEASE_STORE_PASSWORD: ${{ secrets.FINANCESPY_RELEASE_STORE_PASSWORD }}
          FINANCESPY_RELEASE_KEY_ALIAS: ${{ secrets.FINANCESPY_RELEASE_KEY_ALIAS }}
          FINANCESPY_RELEASE_KEY_PASSWORD: ${{ secrets.FINANCESPY_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Upload debug APK artifact
        if: inputs.buildType != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: financespy-debug-apk
          path: native/financespy-kmp/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK artifact
        if: inputs.buildType == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: financespy-release-apk
          path: native/financespy-kmp/androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
