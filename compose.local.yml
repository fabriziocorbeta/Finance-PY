# FinancePY — Hosting local (PC de casa) durante fase de prueba, no comercial.
# Postgres corre en esta misma PC (servicio `postgres` abajo) -- cada query del
# app antes cruzaba a Supabase en Oregon (~250ms por round-trip); en la misma
# LAN/host es submilisegundo. Supabase se mantiene como réplica de respaldo:
# bin/backup_to_supabase.sh (cron nocturno en el host) vuelca esta Postgres
# local ahí, así que si esta PC muere el app puede apuntar de vuelta a
# Supabase en minutos sin perder datos. Ver docs/db-migration-2026-09-01.md.
#
# Uso (dentro de WSL2/Ubuntu con Docker Desktop):
#   cp .env.production.example .env.local && editar valores
#   docker compose -f compose.local.yml --env-file .env.local up -d --build
#
# Networking: Cloudflare Tunnel aparte apunta a http://localhost:8080 (Caddy).
# Ver docs/cloudflared-config.yml.example
#
# Límites de recursos (para no afectar a otras personas usando esta PC):
# Total: ~3.2GB RAM / ~2.25 cores (subido de ~2.7GB/2 cores el 2026-09-01 al
# sumar Postgres local -- la PC tiene 16GB reales, sigue siendo un techo
# autoimpuesto de cortesía, no un límite de hardware). Números base
# sincronizados 2026-08-04 con compose.prod.yml (commit 5656158) -- incluye
# el fix de WEB_CONCURRENCY=1 que evita el OOM real encontrado durante el
# intento de Render (Puma en cluster mode con 2 workers no entra en una
# instancia chica). cpu_shares bajo en todos los servicios: en contención, el
# uso normal de la PC gana prioridad sobre estos contenedores.

x-rails-env: &rails_env
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE requerido en .env.local}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL requerido en .env.local (Postgres local, ver postgres service abajo)}
  SELF_HOSTED: "true"
  RAILS_FORCE_SSL: "false"
  RAILS_ASSUME_SSL: "true"
  APP_DOMAIN: ${APP_DOMAIN:-finance.cd-co.com.py}
  PRODUCT_NAME: ${PRODUCT_NAME:-FinancePY}
  BRAND_NAME: ${BRAND_NAME:-CD & Co.}
  REDIS_URL: redis://redis:6379/1
  ONBOARDING_STATE: ${ONBOARDING_STATE:-closed}
  EXCHANGE_RATE_PROVIDER: ${EXCHANGE_RATE_PROVIDER:-yahoo_finance}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://finance.cd-co.com.py}
  CSP_REPORT_ONLY: ${CSP_REPORT_ONLY:-false}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_ACCESS_TOKEN: ${OPENAI_ACCESS_TOKEN:-}
  OPENAI_URI_BASE: ${OPENAI_URI_BASE:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  ANDROID_WEBHOOK_TOKEN: ${ANDROID_WEBHOOK_TOKEN:?ANDROID_WEBHOOK_TOKEN requerido en .env.local}
  ANDROID_WEBHOOK_FAMILY_ID: ${ANDROID_WEBHOOK_FAMILY_ID:?ANDROID_WEBHOOK_FAMILY_ID requerido en .env.local}

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
    networks:
      - financespy_net
    mem_limit: 128m
    cpus: 0.25
    cpu_shares: 256

  web:
    build: .
    volumes:
      - app-storage:/rails/storage
    restart: unless-stopped
    environment:
      <<: *rails_env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - financespy_net
    mem_limit: 1536m
    cpus: 1.0
    cpu_shares: 512

  worker:
    build: .
    command: bundle exec sidekiq -c 5
    volumes:
      - app-storage:/rails/storage
    restart: unless-stopped
    environment:
      <<: *rails_env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - financespy_net
    mem_limit: 768m
    cpus: 0.5
    cpu_shares: 512

  redis:
    image: redis:8.8
    restart: unless-stopped
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - financespy_net
    mem_limit: 256m
    cpus: 0.25
    cpu_shares: 256

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: financespy
      POSTGRES_USER: ${POSTGRES_LOCAL_USER:?POSTGRES_LOCAL_USER requerido en .env.local}
      POSTGRES_PASSWORD: ${POSTGRES_LOCAL_PASSWORD:?POSTGRES_LOCAL_PASSWORD requerido en .env.local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - financespy_net
    mem_limit: 640m
    cpus: 0.5
    cpu_shares: 512

volumes:
  app-storage:
  redis-data:
  postgres-data:

networks:
  financespy_net:
    driver: bridge
