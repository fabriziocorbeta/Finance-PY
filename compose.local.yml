# FinancePY — Hosting local (PC de casa) durante fase de prueba, no comercial.
# Postgres corre en esta misma PC (servicio `postgres` abajo) -- cada query del
# app antes cruzaba a Supabase en Oregon (~250ms por round-trip); en la misma
# LAN/host es submilisegundo. Supabase se mantiene como réplica de respaldo:
# bin/backup_to_supabase.sh (cron nocturno en el host) vuelca esta Postgres
# local ahí, así que si esta PC muere el app puede apuntar de vuelta a
# Supabase en minutos sin perder datos. Ver docs/db-migration-2026-09-01.md.
#
# Uso (dentro de WSL2/Ubuntu con Docker Desktop):
#   cp .env.production.example .env.local && editar valores
#   docker compose -f compose.local.yml --env-file .env.local up -d --build
#
# Networking: Cloudflare Tunnel aparte apunta a http://localhost:8080 (Caddy).
# Ver docs/cloudflared-config.yml.example
#
# Límites de recursos (para no afectar a otras personas usando esta PC):
# Total: ~4.77GB RAM / 3.0 cores. ACTUALIZADO 2026-10-20: RAM del host subida
# a 6GB y .wslconfig (memory=) subido en consecuencia, CPU a 3 cores -- antes
# eran ~3.2GB/2.25 cores sobre una PC de 8GB con WSL2 topeado en 4GB
# explícitos, que dejaba ~65MB libres en uso normal (`free -h` lo confirmó).
# La prioridad del reparto nuevo fue Postgres: corría con mem_limit=640m
# pero sin ningún tuning propio (shared_buffers etc. en default de fábrica,
# 128MB), así que la mitad de esa memoria ya asignada quedaba sin usar -- ver
# command: más abajo. Igual que antes, dejar margen bajo el tope real del
# host (6GB), no ocuparlo entero -- si se agregan servicios o se suben
# límites de nuevo, hacerlo con `free -h` a la vista. El host también tiene
# 2GB de swap, que es colchón del sistema operativo ante un pico puntual
# (lento porque va a disco, no una opción para correr algo ahí a propósito),
# no licencia para subir mem_limit por encima de la RAM real disponible.
# Numeros base
# sincronizados históricamente con compose.prod.yml (commit 5656158) --
# incluye el fix de WEB_CONCURRENCY=1 que evita el OOM real encontrado
# durante el intento de Render (Puma en cluster mode con 2 workers no entra
# en una instancia chica), que sigue valiendo sin importar el tamaño del
# host. cpu_shares bajo en todos los servicios: en contención, el uso normal
# de la PC gana prioridad sobre estos contenedores.

x-rails-env: &rails_env
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE requerido en .env.local}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL requerido en .env.local (Postgres local, ver postgres service abajo)}
  SELF_HOSTED: "true"
  RAILS_FORCE_SSL: "false"
  RAILS_ASSUME_SSL: "true"
  APP_DOMAIN: ${APP_DOMAIN:-finance.cd-co.com.py}
  PRODUCT_NAME: ${PRODUCT_NAME:-FinancePY}
  BRAND_NAME: ${BRAND_NAME:-CD & Co.}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD requerido en .env.local (ver docs/ops/deploy-runbook.md para el orden de deploy)}@redis:6379/1
  ONBOARDING_STATE: ${ONBOARDING_STATE:-closed}
  EXCHANGE_RATE_PROVIDER: ${EXCHANGE_RATE_PROVIDER:-yahoo_finance}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://finance.cd-co.com.py}
  CSP_REPORT_ONLY: ${CSP_REPORT_ONLY:-false}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_ACCESS_TOKEN: ${OPENAI_ACCESS_TOKEN:-}
  OPENAI_URI_BASE: ${OPENAI_URI_BASE:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  # Fijadas explicitas 2026-09-04 (antes se derivaban de SECRET_KEY_BASE en
  # cada boot, ver config/initializers/active_record_encryption.rb) -- que
  # un solo secreto cubra sesiones/cookies Y cifrado de datos (otp_secret,
  # client_secret SSO) es reusar una clave para dos propositos distintos.
  # Vacio por default a proposito: si faltan, el initializer sigue derivando
  # de SECRET_KEY_BASE como antes (mismo comportamiento, no un requerimiento
  # nuevo) -- deben setearse en .env.local con los valores YA derivados
  # (no valores nuevos, o se pierde acceso a datos ya cifrados).
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:-}
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:-}
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:-}

services:
  caddy:
    # caddy:2-alpine (no caddy:2/debian) porque el healthcheck usa wget de
    # BusyBox -- la imagen debian del tag "2" no trae curl ni wget instalados
    # (Dockerfile oficial: caddyserver/caddy-docker, stage final FROM
    # debian:*-slim solo con ca-certificates/libcap2-bin/mailcap). Digest
    # resuelto 2026-09-23 vs Docker Hub, mismo major (2), no cambia versión.
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - financespy_net
    mem_limit: 128m
    cpus: 0.25
    cpu_shares: 256

  web:
    build: .
    volumes:
      - app-storage:/rails/storage
    restart: unless-stopped
    environment:
      <<: *rails_env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      # /up es el endpoint estándar de Rails (Rails::HealthController,
      # config/routes.rb) -- 200 sin tocar DB/Redis por diseño de Rails,
      # así que esto confirma que Puma responde, no que el stack completo
      # esté sano (eso ya lo cubren los depends_on de redis/postgres).
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - financespy_net
    mem_limit: 2048m
    cpus: 1.0
    cpu_shares: 512

  worker:
    build: .
    command: bundle exec sidekiq -c 5
    volumes:
      - app-storage:/rails/storage
    restart: unless-stopped
    environment:
      <<: *rails_env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      # Chequeo de proceso vivo, no de conectividad a Redis -- procps ya está
      # instalado en el Dockerfile (pgrep). Sidekiq no expone un endpoint
      # HTTP propio en este setup, y sidekiqmon (disponible en sidekiq 8.0.5,
      # ver Gemfile.lock) requiere acceso a Redis para reportar, lo que
      # duplicaría el chequeo de depends_on en vez de aislar "el proceso
      # sigue vivo" de "Redis está sano".
      test: ["CMD-SHELL", "pgrep -f 'sidekiq' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - financespy_net
    mem_limit: 1024m
    cpus: 0.75
    cpu_shares: 512

  redis:
    # Digest resuelto 2026-09-23 vs Docker Hub, mismo tag/major (8.8).
    image: redis:8.8@sha256:0808d25ce768580377c7db21c2a2c63e47f51d9bccf43713bd1e3744061dd7f2
    restart: unless-stopped
    # --requirepass: sin esto, cualquier proceso en financespy_net (o un
    # contenedor comprometido en la misma red bridge) lee/escribe Redis sin
    # autenticar -- incluye sesiones cacheadas y la cola de Sidekiq con jobs
    # que llevan payloads de negocio. --appendonly yes: antes solo tenía
    # snapshotting RDB implícito de la imagen; AOF evita perder jobs en cola
    # y cache reciente ante un `docker restart`/crash entre snapshots.
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD requerido en .env.local (ver docs/ops/deploy-runbook.md)} --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD requerido en .env.local (ver docs/ops/deploy-runbook.md)}
    networks:
      - financespy_net
    mem_limit: 288m
    cpus: 0.25
    cpu_shares: 256

  postgres:
    # Digest resuelto 2026-09-23 vs Docker Hub, mismo tag/major (17).
    image: postgres:17@sha256:f4c66b820c6f974249089d3d16d86a3698eae11e8746eb6644b2271031e91232
    restart: unless-stopped
    # Tuning explícito en vez de los defaults de fábrica (shared_buffers=128MB
    # sin importar mem_limit). Con mem_limit en 640m el contenedor tenía casi
    # el doble de lo que Postgres realmente usaba para cachear datos -- medido
    # 2026-10-20 durante una revisión de performance. Números calculados sobre
    # el mem_limit de 1280m de abajo: shared_buffers ~25% (320MB, regla
    # estándar de Postgres), effective_cache_size ~70% (896MB, el estimado de
    # cuánto del resto el kernel va a cachear vía page cache aunque Postgres
    # no lo controle), work_mem conservador porque hay pool de 7 conexiones
    # (RAILS_MAX_THREADS+4) más las de Sidekiq que pueden ordenar/agrupar en
    # paralelo -- 8MB * 7 ya son 56MB, dejar margen. Si se sube mem_limit de
    # nuevo, recalcular estos tres en la misma proporción, no solo el límite.
    command: >
      postgres
      -c shared_buffers=320MB
      -c effective_cache_size=896MB
      -c work_mem=8MB
      -c maintenance_work_mem=96MB
    environment:
      POSTGRES_DB: financespy
      POSTGRES_USER: ${POSTGRES_LOCAL_USER:?POSTGRES_LOCAL_USER requerido en .env.local}
      POSTGRES_PASSWORD: ${POSTGRES_LOCAL_PASSWORD:?POSTGRES_LOCAL_PASSWORD requerido en .env.local}
      # Explícito en vez de confiar en el default de la imagen oficial (que
      # ya es scram-sha-256 para host connections desde ~2022, ver
      # docs/ops/host-hardening.md#pg_hba) -- así queda auditable acá mismo
      # y no depende de qué versión de la imagen se use.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - financespy_net
    mem_limit: 1280m
    cpus: 0.75
    cpu_shares: 512

volumes:
  app-storage:
  redis-data:
  postgres-data:

networks:
  financespy_net:
    driver: bridge
