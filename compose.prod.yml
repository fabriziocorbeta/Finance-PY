# FinancePY — Producción en VM (Google Compute Engine) + Supabase Postgres
# Datos críticos viven en Supabase → la VM es descartable.
# Uso:
#   cp .env.production.example .env && editar valores
#   docker compose -f compose.prod.yml up -d --build

x-rails-env: &rails_env
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE requerido en .env}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL requerido en .env (Supabase session pooler)}
  SELF_HOSTED: "true"
  RAILS_FORCE_SSL: "false"
  RAILS_ASSUME_SSL: "true"
  APP_DOMAIN: ${APP_DOMAIN:-finance.cd-co.com.py}
  PRODUCT_NAME: ${PRODUCT_NAME:-FinancePY}
  BRAND_NAME: ${BRAND_NAME:-CD & Co.}
  REDIS_URL: redis://redis:6379/1
  ONBOARDING_STATE: ${ONBOARDING_STATE:-closed}
  EXCHANGE_RATE_PROVIDER: ${EXCHANGE_RATE_PROVIDER:-yahoo_finance}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://finance.cd-co.com.py}
  CSP_REPORT_ONLY: ${CSP_REPORT_ONLY:-false}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  # AI Assistant vía NVIDIA API Catalog (endpoint OpenAI-compatible, modelos open-weight)
  OPENAI_ACCESS_TOKEN: ${OPENAI_ACCESS_TOKEN:-}
  OPENAI_URI_BASE: ${OPENAI_URI_BASE:-}
  # Android purchase-notification webhook (POST /webhooks/android_purchase)
  ANDROID_WEBHOOK_TOKEN: ${ANDROID_WEBHOOK_TOKEN:-}
  ANDROID_WEBHOOK_FAMILY_ID: ${ANDROID_WEBHOOK_FAMILY_ID:-}
  INTERNAL_VERSION_TOKEN: ${INTERNAL_VERSION_TOKEN:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}

services:
  # Resource limits below (mem_limit/cpus) exist because this stack shares a
  # machine other people use normally (a household PC, not a dedicated VM) --
  # without a cap, Puma/Sidekiq/Redis have no reason not to grow into all
  # available RAM/CPU. Budget: ~2.7GB total, well under the ~4-5GB ceiling
  # agreed for the whole app so the rest of the machine stays responsive.
  caddy:
    image: caddy:2
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    networks:
      - financespy_net

  web:
    build: .
    mem_limit: 1536m
    cpus: 1.0
    volumes:
      - app-storage:/rails/storage
    restart: unless-stopped
    environment:
      <<: *rails_env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    depends_on:
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - financespy_net

  worker:
    build: .
    command: bundle exec sidekiq -c 5
    mem_limit: 768m
    cpus: 0.5
    volumes:
      - app-storage:/rails/storage
    restart: unless-stopped
    environment:
      <<: *rails_env
    depends_on:
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - financespy_net

  redis:
    image: redis:8.8
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - financespy_net

  # Ad hoc test verification on the VM, isolated from the real Supabase DB.
  # DATABASE_URL is a single global env var Rails applies to every RAILS_ENV
  # regardless of what config/database.yml says per-environment -- there was
  # no TEST_DATABASE_URL, so `bin/rails test` run against the `web`/`worker`
  # services hit the same production Supabase database as `production`
  # (confirmed live: Family.pluck(:name) identical under RAILS_ENV=test and
  # the default env). CI already runs the real suite safely against its own
  # ephemeral postgres:17 service (see .github/workflows/ci.yml) -- this
  # mirrors that setup for local/VM verification. Gated behind the "test"
  # profile so neither service starts with a normal `docker compose up`.
  #
  # Usage:
  #   docker compose -f compose.prod.yml --profile test up -d test-db
  #   docker compose -f compose.prod.yml --profile test run --rm test-runner
  #
  # WARNING: to stop test-db afterward, name it explicitly:
  #   docker compose -f compose.prod.yml stop test-db && docker compose -f compose.prod.yml rm -f test-db
  # `docker compose --profile test down` (no service name) tears down the
  # ENTIRE stack -- web/worker/redis/caddy included, not just the profile's
  # own services -- and took production down for real on 2026-07-28 before
  # this warning existed. Never run a bare `down` with this profile flag.
  test-db:
    image: postgres:17
    profiles: ["test"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - financespy_net

  test-runner:
    build: .
    profiles: ["test"]
    environment:
      RAILS_ENV: test
      # Must differ from test-db's bootstrap POSTGRES_DB (postgres) --
      # db:test:purge drops and recreates this database on every run, and
      # Postgres refuses to drop the database a connection is currently
      # using. Rails creates financespy_test itself via the bootstrap
      # "postgres" database the first time db:test:prepare runs.
      DATABASE_URL: postgresql://postgres:postgres@test-db:5432/financespy_test
      REDIS_URL: redis://redis:6379/2
      SECRET_KEY_BASE: test-secret-key-base-not-used-for-anything-real
    depends_on:
      test-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: []
    command: ["bash", "-c", "bin/rails db:test:prepare && bin/rails test"]
    networks:
      - financespy_net

volumes:
  app-storage:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  financespy_net:
    driver: bridge
