# FinancePY — Producción en VM (Google Compute Engine) + Supabase Postgres
# Datos críticos viven en Supabase → la VM es descartable.
# Uso:
#   cp .env.production.example .env && editar valores
#   docker compose -f compose.prod.yml up -d --build

x-logging: &default_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-rails-env: &rails_env
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE requerido en .env}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL requerido en .env (Supabase session pooler)}
  SELF_HOSTED: ${SELF_HOSTED:-true}
  RAILS_FORCE_SSL: "false"
  RAILS_ASSUME_SSL: "true"
  REVERSE_PROXY_HANDLES_COMPRESSION: "true"
  APP_DOMAIN: ${APP_DOMAIN:-finance.cd-co.com.py}
  PRODUCT_NAME: ${PRODUCT_NAME:-FinancePY}
  BRAND_NAME: ${BRAND_NAME:-CD & Co.}
  # Sidekiq queues/retries/cron live on dedicated noeviction + AOF Redis;
  # Rails.cache & Rack::Attack live on separate allkeys-lru Redis cache.
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD requerido en .env}@redis:6379/1
  REDIS_CACHE_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD requerido en .env}@redis-cache:6379/0
  ONBOARDING_STATE: ${ONBOARDING_STATE:-closed}
  EXCHANGE_RATE_PROVIDER: ${EXCHANGE_RATE_PROVIDER:-yahoo_finance}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://finance.cd-co.com.py}
  CSP_REPORT_ONLY: ${CSP_REPORT_ONLY:-false}
  # Active Storage (recomendado: cloudflare / amazon / google para VM descartable)
  ACTIVE_STORAGE_SERVICE: ${ACTIVE_STORAGE_SERVICE:-local}
  CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
  CLOUDFLARE_ACCESS_KEY_ID: ${CLOUDFLARE_ACCESS_KEY_ID:-}
  CLOUDFLARE_SECRET_ACCESS_KEY: ${CLOUDFLARE_SECRET_ACCESS_KEY:-}
  CLOUDFLARE_BUCKET: ${CLOUDFLARE_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-}
  GCS_PROJECT: ${GCS_PROJECT:-}
  GCS_BUCKET: ${GCS_BUCKET:-}
  GCS_KEYFILE_JSON: ${GCS_KEYFILE_JSON:-}
  # SMTP (resets de contraseña, invitaciones, reportes)
  SMTP_ADDRESS: ${SMTP_ADDRESS:-}
  SMTP_PORT: ${SMTP_PORT:-465}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_TLS_ENABLED: ${SMTP_TLS_ENABLED:-true}
  SMTP_TLS_SKIP_VERIFY: ${SMTP_TLS_SKIP_VERIFY:-false}
  EMAIL_SENDER: ${EMAIL_SENDER:-}
  # Observabilidad
  SENTRY_DSN: ${SENTRY_DSN:-}
  # Mobile Version Check (GET /api/v1/app_config)
  MOBILE_MIN_SUPPORTED_VERSION: ${MOBILE_MIN_SUPPORTED_VERSION:-0.2.0}
  MOBILE_LATEST_VERSION: ${MOBILE_LATEST_VERSION:-0.2.0}
  MOBILE_MIN_ANDROID_VERSION_CODE: ${MOBILE_MIN_ANDROID_VERSION_CODE:-5}
  MOBILE_LATEST_ANDROID_VERSION_CODE: ${MOBILE_LATEST_ANDROID_VERSION_CODE:-5}
  MOBILE_MIN_IOS_BUILD: ${MOBILE_MIN_IOS_BUILD:-1}
  MOBILE_LATEST_IOS_BUILD: ${MOBILE_LATEST_IOS_BUILD:-1}
  MOBILE_ANDROID_STORE_URL: ${MOBILE_ANDROID_STORE_URL:-https://play.google.com/store/apps/details?id=py.com.cdco.financespy}
  MOBILE_IOS_STORE_URL: ${MOBILE_IOS_STORE_URL:-}
  MOBILE_DIRECT_APK_URL: ${MOBILE_DIRECT_APK_URL:-}
  MOBILE_FORCE_UPDATE: ${MOBILE_FORCE_UPDATE:-false}
  MOBILE_RELEASE_NOTES: ${MOBILE_RELEASE_NOTES:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  # AI Assistant vía NVIDIA API Catalog (endpoint OpenAI-compatible, modelos open-weight)
  OPENAI_ACCESS_TOKEN: ${OPENAI_ACCESS_TOKEN:-}
  OPENAI_URI_BASE: ${OPENAI_URI_BASE:-}
  INTERNAL_VERSION_TOKEN: ${INTERNAL_VERSION_TOKEN:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  OPENAI_FALLBACK_MODELS: ${OPENAI_FALLBACK_MODELS:-}
  OPENAI_CHAT_ATTEMPT_TIMEOUT: ${OPENAI_CHAT_ATTEMPT_TIMEOUT:-}
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:?ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY requerido en .env}
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:?ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY requerido en .env}
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:?ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT requerido en .env}
  # Sidekiq Web basic auth. `:-` and not `:?` on purpose: a missing/empty value
  # locks the panel via random credentials in config/initializers/sidekiq.rb.
  SIDEKIQ_WEB_USERNAME: ${SIDEKIQ_WEB_USERNAME:-}
  SIDEKIQ_WEB_PASSWORD: ${SIDEKIQ_WEB_PASSWORD:-}

services:
  caddy:
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    logging: *default_logging
    mem_limit: 128m
    cpus: 0.25
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - financespy_net

  web:
    build: .
    logging: *default_logging
    mem_limit: 1536m
    cpus: 1.0
    volumes:
      - app-storage:/rails/storage
    restart: unless-stopped
    environment:
      <<: *rails_env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    depends_on:
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - financespy_net

  worker:
    build: .
    command: bundle exec sidekiq -c 5
    logging: *default_logging
    mem_limit: 768m
    cpus: 0.5
    volumes:
      - app-storage:/rails/storage
    restart: unless-stopped
    environment:
      <<: *rails_env
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'sidekiq' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - financespy_net

  redis:
    image: redis:8.8@sha256:0808d25ce768580377c7db21c2a2c63e47f51d9bccf43713bd1e3744061dd7f2
    restart: unless-stopped
    logging: *default_logging
    mem_limit: 256m
    cpus: 0.25
    # Dedicated Sidekiq Redis: MUST use noeviction + AOF persistence + auth.
    command: redis-server --maxmemory 200mb --maxmemory-policy noeviction --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD requerido en .env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD requerido en .env}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - financespy_net

  redis-cache:
    image: redis:8.8@sha256:0808d25ce768580377c7db21c2a2c63e47f51d9bccf43713bd1e3744061dd7f2
    restart: unless-stopped
    logging: *default_logging
    mem_limit: 128m
    cpus: 0.15
    # Ephemeral cache + Rack::Attack store: safe to evict via allkeys-lru.
    command: redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru --save "" --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD requerido en .env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD requerido en .env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - financespy_net

  # Ad hoc test verification on the VM, isolated from the real Supabase DB.
  # DATABASE_URL is a single global env var Rails applies to every RAILS_ENV
  # regardless of what config/database.yml says per-environment -- there was
  # no TEST_DATABASE_URL, so `bin/rails test` run against the `web`/`worker`
  # services hit the same production Supabase database as `production`
  # (confirmed live: Family.pluck(:name) identical under RAILS_ENV=test and
  # the default env). CI already runs the real suite safely against its own
  # ephemeral postgres:17 service (see .github/workflows/ci.yml) -- this
  # mirrors that setup for local/VM verification. Gated behind the "test"
  # profile so neither service starts with a normal `docker compose up`.
  #
  # Usage:
  #   docker compose -f compose.prod.yml --profile test up -d test-db
  #   docker compose -f compose.prod.yml --profile test run --rm test-runner
  #
  # WARNING: to stop test-db afterward, name it explicitly:
  #   docker compose -f compose.prod.yml stop test-db && docker compose -f compose.prod.yml rm -f test-db
  # `docker compose --profile test down` (no service name) tears down the
  # ENTIRE stack -- web/worker/redis/caddy included, not just the profile's
  # own services -- and took production down for real on 2026-07-28 before
  # this warning existed. Never run a bare `down` with this profile flag.
  test-db:
    image: postgres:17
    profiles: ["test"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - financespy_net

  test-runner:
    build: .
    profiles: ["test"]
    environment:
      RAILS_ENV: test
      # Must differ from test-db's bootstrap POSTGRES_DB (postgres) --
      # db:test:purge drops and recreates this database on every run, and
      # Postgres refuses to drop the database a connection is currently
      # using. Rails creates financespy_test itself via the bootstrap
      # "postgres" database the first time db:test:prepare runs.
      DATABASE_URL: postgresql://postgres:postgres@test-db:5432/financespy_test
      REDIS_URL: redis://redis:6379/2
      SECRET_KEY_BASE: test-secret-key-base-not-used-for-anything-real
    depends_on:
      test-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: []
    command: ["bash", "-c", "bin/rails db:test:prepare && bin/rails test"]
    networks:
      - financespy_net

volumes:
  app-storage:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  financespy_net:
    driver: bridge
