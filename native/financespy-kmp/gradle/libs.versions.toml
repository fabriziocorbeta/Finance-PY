[versions]
appcompat = "1.7.0"
# 1.1.0 is the actual latest STABLE androidx.biometric release; the 1.2.x/1.3.x/
# 1.4.x lines (biometric-ktx, biometric-compose) are still alpha as of 2026-09,
# so "go stable" here means stepping DOWN from the 1.2.0-alpha05 this project
# had pinned, not up. Verified via WebSearch, no local Maven access to confirm
# further -- re-check when CI runs.
biometric = "1.1.0"
kotlin = "2.4.20"
agp = "8.7.3"
compose-multiplatform = "1.7.3"
ktor = "3.0.3"
# Room 2.x is in maintenance mode (no breaking API changes vs the 2.7.0-alpha11
# driver API this project already targets); 2.7.2 is the first STABLE release
# on that same minor line. Deliberately NOT jumping to the newer 2.8.x line or
# the Room 3.0 rewrite (KMP-first, different API surface) -- out of scope for
# a "pin to stable" pass, would need its own migration + testing pass.
room = "2.7.2"
# Paired with Room 2.7.x per androidx.sqlite release notes (Room 2.7.x links
# against sqlite 2.5.x); 2.5.2 is the latest stable in that line.
sqlite = "2.5.2"
koin = "4.0.2"
kotlinx-serialization = "1.7.3"
kotlinx-coroutines = "1.9.0"
androidx-activity-compose = "1.9.3"
# NOT bumped: Compose Multiplatform 1.7.3 (this project's CMP version) ships
# navigation-compose 2.8.0-alpha10 as its documented pairing -- there is no
# stable navigation-compose release compatible with CMP 1.7.3, only alphas.
# 2.8.0-alpha11 (kept) is a patch ahead of the documented alpha10 pairing.
# Forcing a newer navigation-compose (2.9.x/2.10.x betas exist) without also
# upgrading CMP itself risks an untestable API mismatch we can't verify locally
# (no JDK/Android SDK here, CI only builds on PR). Reaching a stable
# navigation-compose requires a CMP upgrade first -- out of scope for this task,
# documented as deuda per CLAUDE.md instructions ("si una premisa es falsa,
# documentalo y no fuerces el cambio").
navigationCompose = "2.8.0-alpha11"
core-splashscreen = "1.0.1"
lifecycle = "2.8.0"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
ktor-client-auth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "core-splashscreen" }
lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
room = { id = "androidx.room", version.ref = "room" }
