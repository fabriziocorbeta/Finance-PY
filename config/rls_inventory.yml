users:
  class: User
  classification: auth
  family_path: users.family_id (propio, pero la tabla se consulta ANTES de conocer la family)
  force: false
  notes: Raiz de identidad; Session#user, find_by(email:) en login, etc.
  policy_present: false
valuations:
  class: Valuation
  classification: direct
  family_path: valuations.family_id
  force: true
  notes: entryable de Entry.
  policy_present: true
vehicles:
  class: Vehicle
  classification: indirect
  family_path: accounts.accountable_id/type = vehicles.id (reverse FK, NO columna family_id/account_id
    en vehicles) -> accounts.family_id
  force: false
  notes: delegated_type :accountable; FamilyIdPropagatable sincroniza family_id hacia el accountable SOLO
    si el accountable responde a family_id= (estas 9 clases no tienen esa columna, asi que el propagate
    es un no-op para ellas).
  policy_present: false
versions:
  class: Version
