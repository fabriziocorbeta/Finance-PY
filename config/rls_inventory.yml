  policy_present: false
statement_imports:
  class: StatementImport
  classification: direct
  family_path: statement_imports.family_id
  force: false
  notes: Tambien user_id.
  policy_present: false
subscriptions:
  class: Subscription
  classification: direct
  family_path: subscriptions.family_id
  force: false
  notes: Stripe billing.
  policy_present: false
syncs:
  class: Sync
  classification: direct
  family_path: syncs.family_id
  force: false
  notes: syncable polymorphic (PlaidItem, SimplefinItem, etc, y self via parent_id).
  policy_present: false
taggings:
  class: Tagging
  classification: indirect
  family_path: 'taggings.tag_id -> tags.family_id (taggable polymorphic: hoy solo Transaction)'
  force: false
  notes: SIN RLS propia; tags SI tiene FORCE.
  policy_present: false
tags:
  class: Tag
  classification: direct
  family_path: tags.family_id
  force: true
  notes: null
  policy_present: true
tool_calls:
  class: ToolCall
  classification: indirect
  family_path: tool_calls.message_id -> messages.chat_id -> chats.user_id -> users.family_id
  force: false
  notes: Cadena de 3 saltos.
