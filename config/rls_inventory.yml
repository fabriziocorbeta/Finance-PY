transactions:
  class: Transaction
  classification: direct
  family_path: transactions.family_id
  force: true
  notes: entryable de Entry; category_id/merchant_id secundarios.
  policy_present: true
transfers:
  class: Transfer
  classification: indirect
  family_path: transfers.inflow_transaction_id/outflow_transaction_id -> transactions.family_id (ambas
    patas deberian ser de la MISMA family)
  force: false
  notes: Representa una transferencia entre 2 cuentas (posiblemente cross-account dentro de la misma family).
